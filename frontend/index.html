<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="shortcut icon" type="image/ico" href="/favicon.ico" />
    <title>Stamon Playground</title>
    <script>
      // 与 App 使用相同的 localStorage.darkMode / 系统偏好设置，尽早决定主题
      (() => {
        const value = localStorage.getItem("darkMode");
        const dark = value === "true" || (value !== "false" && matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.dataset.theme = dark ? "dark" : "light";
      })();
    </script>
    <style>
      html, body { margin: 0; min-height: 100%; }
      #app-loading {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 20px;
        font-family: Roboto, "Noto Sans SC", "Microsoft YaHei", sans-serif;
        color: #1f2937;
        background: #fff;
        font-size: 16px;
      }
      #app-loading[data-theme="dark"],
      html[data-theme="dark"] #app-loading { color: #e6edf3; background: #010409; }
      #app-loading .spinner {
        width: 42px;
        height: 42px;
        box-sizing: border-box;
        border: 3px solid currentColor;
        border-right-color: transparent;
        border-radius: 50%;
        opacity: 0.75;
        animation: app-loading-spin 0.9s linear infinite;
      }
      @keyframes app-loading-spin { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) {
        #app-loading .spinner { animation-duration: 2s; }
      }
    </style>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="app-loading" role="status" aria-live="polite">
      <div class="spinner" aria-hidden="true"></div>
      <div>加载中....</div>
    </div>
    <div id="root"></div>
    <script src="/src/index.jsx" type="module"></script>
  </body>
</html>
